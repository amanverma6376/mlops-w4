name: Iris MLflow Pipeline

on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Cloud credentials
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Train model with MLflow and run tests
        run: |
          # Train model with hyperparameter tuning
          python iris_pipeline_mlflow.py
          
          # Run tests and capture results
          python -m pytest tests/ -v > test_results.txt 2>&1 || echo "Tests completed"
          
          # Create CML report
          echo "# 🚀 ML Pipeline Results with MLflow" > report.md
          echo "" >> report.md
          echo "## 📊 Test Results" >> report.md
          echo '```' >> report.md
          cat test_results.txt >> report.md
          echo '```' >> report.md
          
          # Check if model was created
          if [ -f "model.pkl" ]; then
            echo "" >> report.md
            echo "## ✅ Model Training" >> report.md
            echo "- Model successfully trained and saved as \`model.pkl\`" >> report.md
            echo "- Model size: $(ls -lh model.pkl | awk '{print $5}')" >> report.md
          else
            echo "" >> report.md
            echo "## ❌ Model Training" >> report.md
            echo "- Model training failed or model file not found" >> report.md
          fi
          
          # Check for MLflow artifacts
          if [ -f "logistic_regression_model.pkl" ] || [ -f "random_forest_model.pkl" ] || [ -f "svm_model.pkl" ]; then
            echo "" >> report.md
            echo "## 🧪 MLflow Hyperparameter Tuning" >> report.md
            echo "- Hyperparameter tuning completed successfully" >> report.md
            echo "- Multiple models trained and logged to MLflow" >> report.md
            ls -la *.pkl | while read line; do echo "- $line" >> report.md; done
          fi
          
          # Add training log if available
          if [ -f "training.log" ]; then
            echo "" >> report.md
            echo "## 📝 Training Log" >> report.md
            echo '```' >> report.md
            cat training.log >> report.md
            echo '```' >> report.md
          fi

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Create CML comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md